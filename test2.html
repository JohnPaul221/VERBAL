<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <title>Study.Pilot - Educational Journey</title>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-gradient-custom {
      background: linear-gradient(135deg, #1e69ff 0%, #0047d5 100%);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="relative bg-gradient-custom text-white overflow-hidden min-h-[90vh] rounded-b-[3rem] px-6 lg:px-20">

  <nav class="flex justify-between items-center py-8 relative z-10">
    <div class="flex items-center gap-2">
      <div class="bg-orange-400 p-2 rounded-lg rotate-12">
        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </div>
      <span class="text-2xl font-bold tracking-tight">Study.Pilot</span>
    </div>

    <div class="hidden md:flex items-center gap-8 font-medium">
      <a href="#" class="hover:text-orange-200 transition">Programs</a>
      <a href="#" class="hover:text-orange-200 transition">Pricing</a>
      <button class="bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-full font-bold shadow-lg transition">
        SIGN IN
      </button>
    </div>
  </nav>

  <div class="mt-12 lg:mt-20 grid lg:grid-cols-2 gap-12 items-center">
    <div class="relative z-10">
      <h1 class="text-5xl lg:text-7xl font-extrabold leading-tight mb-6">
        Boost Your <br> Child's Future
      </h1>
      <p class="text-blue-100 text-lg lg:text-xl max-w-md mb-10 leading-relaxed">
        Unlocking Potential, Your Partner in Cultivating Your Child's Educational Journey.
      </p>
      <button class="bg-orange-500 hover:bg-orange-600 flex items-center gap-3 px-10 py-4 rounded-full font-bold text-lg shadow-xl transition-transform hover:scale-105">
        JOIN FOR FREE
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="relative flex justify-center">
      <div class="w-full max-w-lg animate-pulse bg-blue-400/20 rounded-full h-96 flex items-center justify-center border-4 border-dashed border-blue-300">
                    <span class="text-blue-200 font-bold italic text-center px-10">
                        [ Place Character Illustration (Fox, Croc, Cat) Here ]
                    </span>
      </div>
    </div>
  </div>

  <div class="absolute -bottom-24 left-0 right-0 px-6 lg:px-20 grid grid-cols-1 md:grid-cols-3 gap-8">

    <div class="bg-white rounded-[2.5rem] p-8 shadow-2xl transform transition hover:-translate-y-4">
      <div class="flex items-center gap-4 mb-6">
        <span class="bg-blue-500 text-white w-8 h-8 flex items-center justify-center rounded-full font-bold text-sm">1</span>
        <h3 class="text-gray-800 font-bold text-xl">Chemistry</h3>
      </div>
      <div class="h-40 bg-blue-50 rounded-2xl flex items-center justify-center">
        <div class="text-5xl">🧪</div>
      </div>
    </div>

    <div class="bg-white rounded-[2.5rem] p-8 shadow-2xl transform transition hover:-translate-y-4">
      <div class="flex items-center gap-4 mb-6">
        <span class="bg-blue-500 text-white w-8 h-8 flex items-center justify-center rounded-full font-bold text-sm">2</span>
        <h3 class="text-gray-800 font-bold text-xl">Mathematics</h3>
      </div>
      <div class="h-40 bg-green-50 rounded-2xl flex items-center justify-center">
        <div class="text-5xl">📐</div>
      </div>
    </div>

    <div class="bg-white rounded-[2.5rem] p-8 shadow-2xl transform transition hover:-translate-y-4">
      <div class="flex items-center gap-4 mb-6">
        <span class="bg-blue-500 text-white w-8 h-8 flex items-center justify-center rounded-full font-bold text-sm">3</span>
        <h3 class="text-gray-800 font-bold text-xl">Programming</h3>
      </div>
      <div class="h-40 bg-purple-50 rounded-2xl flex items-center justify-center">
        <div class="text-5xl">💻</div>
      </div>
    </div>

  </div>
</div>

<div class="h-48"></div>

</body>
</html>
